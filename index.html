<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>~*~ TERRA-FORM 2000 ~*~ Terrain Modification Project Showcase ~*~</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 10px;
    background-color: #000080;
    background-image:
      repeating-linear-gradient(45deg, #000090 0, #000090 2px, #000080 2px, #000080 40px);
    color: #00ff00;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    font-size: 14px;
  }

  .page {
    max-width: 800px;
    margin: 0 auto;
    background: #000000;
    border: 4px ridge #c0c0c0;
    padding: 4px;
  }

  .inner {
    background: #000000;
    border: 2px solid #00ff00;
    padding: 10px;
  }

  .banner {
    text-align: center;
    padding: 6px 0 10px 0;
  }

  .banner h1 {
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 38px;
    margin: 4px 0;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffff00, #ff8800 40%, #ff0000 70%, #ffff00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 2px 2px 0 #000000;
  }

  .banner .subtitle {
    color: #ffff00;
    font-size: 16px;
    font-weight: bold;
  }

  .rainbow {
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .rainbow span:nth-child(6n+1) { color: #ff0000; }
  .rainbow span:nth-child(6n+2) { color: #ff9900; }
  .rainbow span:nth-child(6n+3) { color: #ffff00; }
  .rainbow span:nth-child(6n+4) { color: #33ff33; }
  .rainbow span:nth-child(6n+5) { color: #33ccff; }
  .rainbow span:nth-child(6n+6) { color: #cc66ff; }

  hr.bar {
    height: 6px;
    border: none;
    background: repeating-linear-gradient(90deg, #ff0000, #ff9900 10%, #ffff00 20%, #00ff00 30%, #0099ff 40%, #6600ff 50%, #ff0000 60%);
    margin: 10px 0;
  }

  .ticker-wrap {
    background: #ff0000;
    color: #ffff00;
    font-weight: bold;
    padding: 4px 0;
    overflow: hidden;
    white-space: nowrap;
    border: 2px solid #ffff00;
    margin: 8px 0;
  }
  .ticker {
    display: inline-block;
    padding-left: 100%;
    animation: scroll-left 14s linear infinite;
  }
  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  .uc-wrap {
    text-align: center;
    padding: 30px 10px;
  }

  .construction-bar {
    background-image: repeating-linear-gradient(45deg, #ffff00, #ffff00 12px, #000000 12px, #000000 24px);
    height: 26px;
    border: 3px solid #000000;
    margin: 14px 0;
  }

  .blink {
    animation: blinker 1s step-start infinite;
  }
  @keyframes blinker { 50% { opacity: 0; } }

  .uc-title {
    font-family: "Arial Black", sans-serif;
    font-size: 30px;
    color: #ffff00;
    text-shadow: 2px 2px 0 #ff0000;
    margin: 10px 0;
  }

  .uc-icon {
    font-size: 60px;
    margin: 10px 0;
  }

  .uc-message {
    color: #ccffcc;
    font-size: 14px;
    max-width: 500px;
    margin: 12px auto;
    line-height: 1.6;
  }

  .uc-message a { color: #00ffff; }
  .uc-message a:visited { color: #ff00ff; }

  .uc-gif-placeholder {
    display: inline-block;
    border: 3px inset #808080;
    background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 10px, #333333 10px, #333333 20px);
    color: #000000;
    font-weight: bold;
    font-size: 11px;
    padding: 12px 20px;
    margin: 10px 0;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #999999;
    margin-top: 16px;
    padding-top: 8px;
    border-top: 1px dashed #00ff00;
  }
  .footer .stamp {
    display: inline-block;
    width: 60px;
    height: 20px;
    background: #444;
    color: #fff;
    font-size: 9px;
    line-height: 20px;
    vertical-align: middle;
  }

  .webmaster-sig {
    font-family: "Courier New", monospace;
    color: #00ffff;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="page">
<div class="inner">

  <div class="banner">
    <p class="rainbow">
      <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
      &nbsp;<span>T</span><span>O</span>&nbsp;<span>T</span><span>H</span><span>E</span>
    </p>
    <h1>TERRA-FORM 2000</h1>
    <div class="subtitle">:: Terrain Modification Project Showcase ::</div>
    <div class="subtitle" style="font-size:12px; color:#00ffff;">By Jack Werremeyer, Kenan Ahn, Tyler Ronnenberg</div>
  </div>

  <hr class="bar">

  <div class="ticker-wrap">
    <span class="ticker">*** This site is currently under construction *** Please check back soon *** </span>
  </div>

  <div class="uc-wrap">
    <div class="uc-icon">&#128679;</div>
    <div class="construction-bar"></div>
    <div class="uc-title"><span class="blink">UNDER CONSTRUCTION</span></div>
    <div class="uc-gif-placeholder">[ CODERS AT WORK ]</div>
    <div class="construction-bar"></div>
  </div>

  <hr class="bar">


</div>
</div>

</body>
</html>
